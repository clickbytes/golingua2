name: Temporary M3 exact-patch verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-m3-patch.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply checksum-pinned reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-verify"
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          assert os.environ['GITHUB_REF']=='refs/heads/main'
          expected_source='788b79b309224155f3c20c721ef87d516c21df8d'
          payload_sha='300057f112ea939b58e65bb07587831c379a2437'
          payload_digest='cb15a3f2446c2c7bd01f4cb6fc25e8f51602a25b16e512ae6099d5307593c1af'
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'m3-verify')
          subprocess.run(['git','merge-base','--is-ancestor',expected_source,'HEAD'],check=True)
          url='https://api.github.com/repos/clickbytes/golingua2/git/blobs/'+payload_sha
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response:
              blob=json.load(response)
          packed=base64.b64decode(blob['content'])
          assert hashlib.sha256(packed).hexdigest()==payload_digest
          assert hashlib.sha1(b'blob '+str(len(packed)).encode()+b'\0'+packed).hexdigest()==payload_sha
          payload=json.loads(lzma.decompress(packed,memlimit=100*1024*1024))
          assert payload['schema']==1 and payload['source_sha']==expected_source
          files=payload['files']
          assert len(files)==18 and len({e['path'] for e in files})==18
          for e in files:
              path=e['path'];file=pathlib.Path(path)
              assert not file.is_absolute() and '..' not in file.parts and '.git' not in file.parts and path!='.github/workflows/verify-m3-patch.yml'
              if e['base_blob'] is None:
                  assert not file.exists(),path
              else:
                  assert subprocess.check_output(['git','hash-object',path],text=True).strip()==e['base_blob'],path
          patch=out/'reviewed.patch';patch.write_text(payload['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          verified=[]
          for e in files:
              content=pathlib.Path(e['path']).read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              assert sha==e['blob'] and hashlib.sha256(content).hexdigest()==e['sha256'],e['path']
              verified.append({'path':e['path'],'mode':'100644','type':'blob','sha':sha})
          (out/'verified-manifest.json').write_text(json.dumps(verified,indent=2))
          (out/'source-head.txt').write_text(os.environ['GITHUB_SHA'])
          PY
      - name: Formatting vet complete tests race and build
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-verify"
          go version > "$out/go-version.txt"
          git diff --check
          test -z "$(gofmt -l cmd internal languages tests)"
          go vet ./... > "$out/vet.log" 2>&1
          go test ./... -count=1 -v > "$out/all-tests.log" 2>&1
          go test -race ./... -count=1 > "$out/race.log" 2>&1
          go build -o "$RUNNER_TEMP/golingua2" ./cmd/golingua2
          "$RUNNER_TEMP/golingua2" --help > "$out/help.log"
          "$RUNNER_TEMP/golingua2" --version > "$out/version.log"
          sha256sum "$RUNNER_TEMP/golingua2" > "$out/binary.sha256"
          echo 'format=0 vet=0 test=0 race=0 build=0 cli=0' > "$out/exits.txt"
      - name: Real CLI positive and negative contrasts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'m3-verify')
          exe=str(pathlib.Path(os.environ['RUNNER_TEMP'],'golingua2'))
          cases=[
            ('pl','en','Kot nie śpi.','A cat does not sleep.'),
            ('en','pl','A cat does not sleep.','Kot nie śpi.'),
            ('pl','en','Nauczyciel nie czyta książki.','A teacher does not read a book.'),
            ('en','pl','A teacher does not read a book.','Nauczyciel nie czyta książki.'),
            ('pl','en','Nie mam samochodu.','I do not have a car.'),
            ('en','pl','I do not have a car.','Nie mam samochodu.'),
            ('pl','en','Nie mamy wody.','We do not have water.'),
            ('en','pl','We do not have water.','Nie mamy wody.'),
            ('pl','en','Kot śpi.','A cat sleeps.'),
            ('en','pl','A cat sleeps.','Kot śpi.'),
          ]
          results=[]
          for src,target,sentence,required in cases:
              argv=[exe,'translate','--from',src,'--to',target,'--text',sentence,'--json']
              process=subprocess.run(argv,capture_output=True,text=True,timeout=30)
              result=json.loads(process.stdout)
              texts=[x['text'] for x in result['candidates']]
              assert process.returncode==0 and required in texts,(sentence,process.returncode,texts)
              results.append({'argv':argv,'exit':process.returncode,'outcome':result['outcome'],'texts':texts,'stderr':process.stderr})
          for lang,sentence in [('en','A dog does not runs.'),('en','A cat do not sleep.'),('pl','Nauczyciel nie czyta książkę.'),('pl','Kot nie śpi psa.')]:
              argv=[exe,'analyze','--from',lang,'--text',sentence,'--json']
              process=subprocess.run(argv,capture_output=True,text=True,timeout=30)
              result=json.loads(process.stdout)
              assert process.returncode!=0 and not result['candidates'],(sentence,result)
              results.append({'argv':argv,'exit':process.returncode,'outcome':result['outcome'],'texts':[],'stderr':process.stderr})
          (out/'cli-results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - name: Store exact verified blobs without moving main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'m3-verify')
          for e in json.loads((out/'verified-manifest.json').read_text()):
              data=pathlib.Path(e['path']).read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert sha==e['sha']
              body=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              req=urllib.request.Request('https://api.github.com/repos/clickbytes/golingua2/git/blobs',data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as response:
                  result=json.load(response)
              assert result['sha']==sha
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golingua2-m3-verified-${{ github.sha }}
          path: ${{ runner.temp }}/m3-verify/
          retention-days: 7
          if-no-files-found: error