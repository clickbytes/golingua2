name: GoLingua2 M0-M1 exact patch verification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m0-m1-verification.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Retrieve pinned authored archives and check exact content
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g2-verified"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          base = 'https://api.github.com/repos/clickbytes/golingua2/git/blobs/'
          inputs = (
              ('d803397d5feaaa891207aae124c78188ae882099','d752a2d7a4d8850b25840dcd7d0e0f2ff84612b445cf3b926d662d5df18ed314',23),
              ('73b2c20ddc4bfc053779f1ca15ed45cd1d240964','c5a756a855cc6f0820a1a7e133ca5dd7cd3a3dfc1e050b83fa6482f161207631',9),
          )
          root=pathlib.Path.cwd()
          merged={}
          for sha,digest,count in inputs:
              req=urllib.request.Request(base+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=40) as response:
                  value=json.load(response)
              data=base64.b64decode(value['content'])
              assert hashlib.sha256(data).hexdigest()==digest,sha
              payload=json.loads(lzma.decompress(data,memlimit=64*1024*1024))
              assert len(payload)==count
              for path,content in payload.items():
                  candidate=pathlib.PurePosixPath(path)
                  assert candidate.parts and '..' not in candidate.parts and not candidate.is_absolute() and path not in merged
                  assert isinstance(content,str) and len(content)<100000
                  merged[path]=content
          assert len(merged)==32
          assert set(('go.mod','README.md','AGENTS.md','tests/a1/a1_cases_test.go','.github/workflows/go.yml')).issubset(merged)
          assert subprocess.check_output(['git','status','--porcelain'],text=True).strip()==''
          for path,content in sorted(merged.items()):
              target=root/path
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(content)
              assert target.read_text()==content
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'g2-verified'/'source-files.txt').write_text('\n'.join(sorted(merged))+'\n')
          PY
      - name: Format, vet, tests, race, build, actual CLI
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g2-verified"
          go version > "$out/go-version.txt"
          test -z "$(gofmt -l cmd internal languages tests)"
          go vet ./... > "$out/vet.log" 2>&1
          go test ./... -count=1 -v > "$out/tests.log" 2>&1
          go test -race ./... -count=1 > "$out/race.log" 2>&1
          go build -o "$RUNNER_TEMP/golingua2" ./cmd/golingua2
          "$RUNNER_TEMP/golingua2" --help > "$out/help.log"
          "$RUNNER_TEMP/golingua2" --version > "$out/version.log"
          "$RUNNER_TEMP/golingua2" translate --from pl --to en --text 'To jest kot.' --near > "$out/cli-pl-en.txt"
          "$RUNNER_TEMP/golingua2" translate --from en --to pl --text 'This book is new.' > "$out/cli-en-pl.txt"
          "$RUNNER_TEMP/golingua2" translate --from pl --to en --text 'Ten pies jest czarny.' --near > "$out/cli-composition.txt"
          test "$(cat "$out/cli-pl-en.txt")" = "$(printf 'outcome: ok\nThis is a cat.')"
          test "$(cat "$out/cli-en-pl.txt")" = "$(printf 'outcome: ok\nTa książka jest nowa.')"
          test "$(cat "$out/cli-composition.txt")" = "$(printf 'outcome: ok\nThis dog is black.')"
          set +e
          "$RUNNER_TEMP/golingua2" translate --from pl --to en --text 'To jest pies.' --json > "$out/cli-unresolved.json"
          rc=$?
          set -e
          test "$rc" -eq 3
          python3 - <<'PY'
          import json,os,pathlib
          x=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'g2-verified'/'cli-unresolved.json').read_text())
          assert x['outcome']=='incomplete' and not x.get('candidates'),x
          PY
          sha256sum "$RUNNER_TEMP/golingua2" > "$out/binary-sha256.txt"
          printf 'format=0\nvet=0\ntest=0\nrace=0\nbuild=0\ncli=0\n' > "$out/check-exits.txt"
      - name: Create verified source blobs without changing branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'g2-verified'
          entries=[]
          for name in (out/'source-files.txt').read_text().splitlines():
              content=pathlib.Path(name).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              req=urllib.request.Request('https://api.github.com/repos/clickbytes/golingua2/git/blobs',data=json.dumps({'content':base64.b64encode(content).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as response:
                  value=json.load(response)
              assert value['sha']==expected,name
              entries.append({'path':name,'mode':'100644','type':'blob','sha':expected})
          (out/'verified-tree-elements.json').write_text(json.dumps(entries,ensure_ascii=False,indent=2))
          (out/'verification-sha.txt').write_text(os.environ['GITHUB_SHA'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golingua2-m0-m1-exact-${{ github.sha }}
          path: ${{ runner.temp }}/g2-verified/
          retention-days: 7
          if-no-files-found: error