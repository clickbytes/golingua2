name: GoLingua 2 — build and M1 acceptance
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go format
        run: test -z "$(gofmt -l cmd internal languages tests)"
      - name: Go vet
        run: go vet ./...
      - name: All tests, including M1 independent IR
        run: go test ./... -count=1
      - name: Race checks
        run: go test -race ./... -count=1
      - name: CLI build and basic smoke
        run: |
          go build -o "$RUNNER_TEMP/golingua2" ./cmd/golingua2
          "$RUNNER_TEMP/golingua2" --help
          "$RUNNER_TEMP/golingua2" --version
          test "$("$RUNNER_TEMP/golingua2" translate --from pl --to en --near --text 'To jest kot.')" = "$(printf 'outcome: ok\nThis is a cat.')"
          test "$("$RUNNER_TEMP/golingua2" translate --from en --to pl --text 'This book is new.')" = "$(printf 'outcome: ok\nTa książka jest nowa.')"
