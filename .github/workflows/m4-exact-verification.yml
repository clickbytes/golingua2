name: M4 exact spatial patch verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m4-exact-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.2'
          cache: false
      - name: Apply pinned and checked M4 patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m4-verified"
          python3 - <<'PY'
          import os, pathlib, hashlib, json, base64, lzma, subprocess, urllib.request
          target = pathlib.Path(os.environ['RUNNER_TEMP'],'m4-verified')
          request = urllib.request.Request('https://api.github.com/repos/clickbytes/golingua2/git/blobs/2973d2914fe8d91312be450c6c8a69d66db69d87',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response: blob=json.load(response)
          raw=base64.b64decode(blob['content'])
          assert hashlib.sha256(raw).hexdigest() == 'dfc72d0b6b8c04d82b2ff8556900a017df0bad6e8122af539e59825b734a9fc0'
          data=json.loads(lzma.decompress(raw,memlimit=64*1024*1024))
          base=data['remote_base_sha']
          assert base=='a208eebe5a741db3cd63cfb7b4daf86440e6e4a6'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          paths=[f['path'] for f in data['files']]
          assert len(paths)==22 and len(set(paths))==22
          assert 'tests/a1/a1_cases_test.go' not in paths
          for file in data['files']:
              path=pathlib.Path(file['path'])
              assert not path.is_absolute() and '..' not in path.parts
              if file['base_blob'] is None:
                  assert not path.exists(),file['path']
              else:
                  assert subprocess.check_output(['git','hash-object',str(path)],text=True).strip()==file['base_blob'],file['path']
          patch=target/'reviewed.patch'
          patch.write_text(data['patch'])
          subprocess.run(['git','apply','--check','--binary',str(patch)],check=True)
          subprocess.run(['git','apply','--binary',str(patch)],check=True)
          for file in data['files']:
              value=pathlib.Path(file['path']).read_bytes()
              sha1=hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest()
              assert sha1==file['blob'] and hashlib.sha256(value).hexdigest()==file['sha256'],file['path']
          (target/'manifest.json').write_text(json.dumps(data['files'],indent=2))
          (target/'source-sha.txt').write_text(os.environ['GITHUB_SHA'])
          PY
      - name: Verify technical controls and full semantic acceptance
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/m4-verified"
          go version > "$target/go-version.txt"
          git diff --check
          test -z "$(gofmt -l $(find cmd internal languages tests -type f -name '*.go'))"
          go vet ./... > "$target/vet.log" 2>&1
          go test ./... -count=1 -v > "$target/tests.log" 2>&1
          go test -race ./... -count=1 > "$target/race.log" 2>&1
          go build -o "$RUNNER_TEMP/golingua2" ./cmd/golingua2
          "$RUNNER_TEMP/golingua2" --version > "$target/version.txt"
          "$RUNNER_TEMP/golingua2" --help > "$target/help.txt"
          sha256sum "$RUNNER_TEMP/golingua2" > "$target/binary-sha256.txt"
          grep 'OBSERVED ONLY: PL→EN 70/100, EN→PL 70/100' "$target/tests.log"
          echo 'format=0 vet=0 test=0 race=0 build=0 cli_smoke=0' > "$target/exits.txt"
      - name: Verify actual Polish and English CLI translations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          tests=pathlib.Path('tests/a1/a1_cases_test.go').read_text()
          cases=[(int(i),pl,en) for i,pl,en in re.findall(r'a1\((\d+), "location", "([^"]+)", "([^"]+)"\)', tests)]
          assert len(cases)==10 and sorted(i for i,_,_ in cases)==list(range(71,81))
          binary=str(root/'golingua2')
          observed=[]
          for id,pl,en in cases:
              for source,target,input,want in [('pl','en',pl,en),('en','pl',en,pl)]:
                  argv=[binary,'translate','--from',source,'--to',target,'--text',input,'--json']
                  r=subprocess.run(argv,capture_output=True,text=True,timeout=20)
                  response=json.loads(r.stdout)
                  texts=[c['text'] for c in response.get('candidates',[])]
                  assert r.returncode==0 and want in texts,(id,argv,response)
                  observed.append({'id':id,'argv':argv,'exit':r.returncode,'output':response,'stderr':r.stderr})
          for source,target,input in [('pl','en','Kot jest w dom.'),('en','pl','The dog are under the table.'),('pl','en','Dziecko jest obok mamą.'),('en','pl','The cat is in house.')]:
              argv=[binary,'translate','--from',source,'--to',target,'--text',input,'--json']
              r=subprocess.run(argv,capture_output=True,text=True,timeout=20)
              response=json.loads(r.stdout)
              assert r.returncode!=0 and not response.get('candidates'),(argv,response)
              observed.append({'argv':argv,'exit':r.returncode,'output':response,'stderr':r.stderr})
          (root/'m4-verified'/'cli.json').write_text(json.dumps(observed,ensure_ascii=False,indent=2))
          PY
      - name: Preserve exact verified Git blobs without moving main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, json, base64, hashlib, urllib.request
          target=pathlib.Path(os.environ['RUNNER_TEMP'],'m4-verified')
          files=json.loads((target/'manifest.json').read_text())
          result=[]
          for entry in files:
              source=pathlib.Path(entry['path']).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(source)).encode()+b'\0'+source).hexdigest()
              assert expected==entry['blob']
              req=urllib.request.Request('https://api.github.com/repos/clickbytes/golingua2/git/blobs',
                  data=json.dumps({'content':base64.b64encode(source).decode(),'encoding':'base64'}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as response: value=json.load(response)
              assert value['sha']==expected
              result.append({'path':entry['path'],'mode':'100644','type':'blob','sha':expected})
          (target/'verified-tree-elements.json').write_text(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golingua2-m4-exact-${{ github.sha }}
          path: ${{ runner.temp }}/m4-verified/
          retention-days: 7
          if-no-files-found: warn