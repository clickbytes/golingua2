name: Temporary M2 exact-patch verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-m2-patch.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify and apply three SHA-pinned reviewed source patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m2-verify"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          assert os.environ['GITHUB_REF']=='refs/heads/main'
          original='9b1555b19764d3999fd11f61b33e2d668f5084f5'
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'m2-verify')
          artifacts=[
            ('runtime','5fa73edb0c35cbb060a876cf4e84caeead96f7fe','9bcaf18f8c1a774481c14fef33e92d28e733a3a1c3e1fd23f7f20f3d2bc130f2'),
            ('languages','1a2d3b2220c680e97d5ac6fc6dd2f3feb0b56475','b5165739a31029951b495e1c2d15e30ebe6647c8ebdb210a41477be34f6925ef'),
            ('acceptance','c446445e0c63f02e6af3576618af0370ceaaf6bb','9b8ebcdf48e6b291016f3e17af83580a5053a794e39f536ae4fe8aaf08a45390'),
          ]
          seen=set()
          manifest=[]
          for name,sha,digest in artifacts:
              url=f'https://api.github.com/repos/clickbytes/golingua2/git/blobs/{sha}'
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  blob=json.load(response)
              packed=base64.b64decode(blob['content'])
              assert hashlib.sha256(packed).hexdigest()==digest, name
              git_sha=hashlib.sha1(b'blob '+str(len(packed)).encode()+b'\0'+packed).hexdigest()
              assert git_sha==sha, name
              payload=json.loads(lzma.decompress(packed,memlimit=512*1024*1024))
              assert payload['schema']==3 and payload['source_sha']==original
              patch=out/(name+'.patch')
              patch.write_text(payload['patch'])
              for entry in payload['files']:
                  path=entry['path']
                  assert path not in seen and not path.startswith('/') and '..' not in pathlib.PurePosixPath(path).parts
                  assert path!='.github/workflows/verify-m2-patch.yml'
                  seen.add(path)
                  file=pathlib.Path(path)
                  if entry['old_blob'] is None:
                      assert not file.exists(), path
                  else:
                      expected=subprocess.check_output(['git','hash-object',str(file)],text=True).strip()
                      assert expected==entry['old_blob'], path
              subprocess.run(['git','apply','--check',str(patch)],check=True)
              subprocess.run(['git','apply',str(patch)],check=True)
              for entry in payload['files']:
                  b=pathlib.Path(entry['path']).read_bytes()
                  digest=hashlib.sha256(b).hexdigest()
                  git_sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
                  assert digest==entry['sha256'] and git_sha==entry['new_blob'],entry['path']
                  manifest.append({'path':entry['path'],'mode':'100644','type':'blob','sha':git_sha})
          assert len(seen)==22, (len(seen),seen)
          (out/'verified-manifest.json').write_text(json.dumps(manifest,indent=2))
          (out/'source-head.txt').write_text(os.environ['GITHUB_SHA'])
          PY
      - name: Build, vet, race, full independent semantics and source-format verification
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/m2-verify"
          git diff --check
          test -z "$(gofmt -l cmd internal languages tests)"
          go version > "$output/go-version.txt"
          go vet ./... > "$output/vet.log" 2>&1
          go test ./... -count=1 -v > "$output/all-tests.log" 2>&1
          go test -race ./... -count=1 > "$output/race.log" 2>&1
          go build -o "$RUNNER_TEMP/golingua2" ./cmd/golingua2
          "$RUNNER_TEMP/golingua2" --help > "$output/help.log"
          "$RUNNER_TEMP/golingua2" --version > "$output/version.log"
          sha256sum "$RUNNER_TEMP/golingua2" > "$output/binary.sha256"
          echo 'format=0 vet=0 test=0 race=0 build=0 help=0 version=0' > "$output/exit-status.txt"
      - name: Verify actual CLI in both directions and bounded alternatives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          output=pathlib.Path(os.environ['RUNNER_TEMP'],'m2-verify')
          exe=str(pathlib.Path(os.environ['RUNNER_TEMP'],'golingua2'))
          tests=[
            ('pl','en','Mam książkę.','I have a book.',[]),
            ('en','pl','I have a book.','Mam książkę.',[]),
            ('pl','en','Nauczyciel czyta książkę.','A teacher reads a book.',[]),
            ('en','pl','A teacher reads a book.','Nauczyciel czyta książkę.',[]),
            ('pl','en','Kot śpi.','A cat sleeps.',[]),
            ('en','pl','A cat sleeps.','Kot śpi.',[]),
            ('pl','en','Tata zamyka drzwi.','A father closes a door.',[]),
            ('en','pl','You have a dog.','Masz psa.',['--addressee','singular']),
            ('en','pl','They have a car.','Oni mają samochód.',[]),
            ('en','pl','A girl drinks water.','Dziewczynka pije wodę.',[]),
          ]
          results=[]
          for src,tgt,sentence,wanted,additional in tests:
              argv=[exe,'translate','--from',src,'--to',tgt,'--text',sentence,'--json']+additional
              p=subprocess.run(argv,capture_output=True,text=True,timeout=20)
              data=json.loads(p.stdout)
              texts=[x['text'] for x in data['candidates']]
              assert p.returncode==0 and wanted in texts,(sentence,p.returncode,texts)
              results.append({'argv':argv,'exit':p.returncode,'status':data['outcome'],'texts':texts,'stderr':p.stderr})
          for sentence in ['A teacher read a book.','A girl drinks a water.']:
              argv=[exe,'analyze','--from','en','--text',sentence,'--json']
              p=subprocess.run(argv,capture_output=True,text=True,timeout=20)
              data=json.loads(p.stdout)
              assert p.returncode!=0 and not data['candidates']
              results.append({'argv':argv,'exit':p.returncode,'status':data['outcome'],'stderr':p.stderr})
          (output/'cli-results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - name: Store exact validated git blobs without moving main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'m2-verify')
          manifest=json.loads((out/'verified-manifest.json').read_text())
          for entry in manifest:
              data=pathlib.Path(entry['path']).read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert sha==entry['sha']
              req=urllib.request.Request('https://api.github.com/repos/clickbytes/golingua2/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as response:
                  created=json.load(response)
              assert created['sha']==sha
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golingua2-m2-verified-${{ github.sha }}
          path: ${{ runner.temp }}/m2-verify/
          retention-days: 7
          if-no-files-found: error